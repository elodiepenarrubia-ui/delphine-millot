# Récupère chaque jour la note, le nombre total d'avis et les 5 avis les plus
# pertinents de la fiche Google Business Profile via l'API Google Places (New),
# puis committe avis.json si quelque chose a changé (ce qui redéploie le site).
#
# Configuration requise (Settings > Secrets and variables > Actions) :
#   - Secret  GOOGLE_PLACES_API_KEY : clé API Google Cloud (Places API New activée)
#   - Variable GOOGLE_PLACE_ID      : Place ID de la fiche (ex: ChIJ...)
#     Trouvable sur https://developers.google.com/maps/documentation/places/web-service/place-id

name: Avis Google

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maj-avis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer les avis via l'API Google Places
        env:
          API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          PLACE_ID: ${{ vars.GOOGLE_PLACE_ID }}
        run: |
          if [ -z "$API_KEY" ] || [ -z "$PLACE_ID" ]; then
            echo "::error::Configurer le secret GOOGLE_PLACES_API_KEY et la variable GOOGLE_PLACE_ID (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          curl -sf "https://places.googleapis.com/v1/places/${PLACE_ID}?languageCode=fr" \
            -H "X-Goog-Api-Key: ${API_KEY}" \
            -H "X-Goog-FieldMask: rating,userRatingCount,reviews" \
            -o reponse.json
          jq '{
            note: .rating,
            nombreAvis: .userRatingCount,
            avis: [(.reviews // [])[] | {
              auteur: (.authorAttribution.displayName // "Client Google"),
              note: .rating,
              texte: (.text.text // ""),
              date: (.relativePublishTimeDescription // "")
            }]
          }' reponse.json > avis.json
          rm reponse.json
          # Garde-fou : ne jamais écraser avis.json avec une réponse vide/invalide
          jq -e '.note != null and .nombreAvis != null' avis.json > /dev/null

      - name: Committer si changement
        run: |
          if git diff --quiet -- avis.json; then
            echo "Avis inchangés, rien à committer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add avis.json
          git commit -m "chore: mise à jour automatique des avis Google"
          git push
